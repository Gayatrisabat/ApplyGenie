[API]
openai_model = gpt-4o-mini

[DATABASE]
db_name = applications.db

[BROWSER]
headless = False
default_wait_ms = 500

[SEARCH]
default_limit = 10

[JOB_SOURCES]
# Priority order: adzuna, remoteok, arbeitnow
# adzuna    — location-aware, best quality; requires free API key from developer.adzuna.com
# remoteok  — free, no auth, remote-only listings
# arbeitnow — free, no auth, EU + remote listings
enabled_sources = adzuna,remoteok,arbeitnow
adzuna_default_country = us
remoteok_timeout_sec = 20
arbeitnow_timeout_sec = 15
