version: '3.8'

services:
  job-automator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o-mini
    volumes:
      # PersistSQLite Database
      - ./data:/app/data
      # Persist Logs
      - ./logs:/app/logs
    restart: unless-stopped
